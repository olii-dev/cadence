[project]
name = "cadence-music"
version = "0.1.0"
description = "A from-scratch symbolic music model trained on MIDI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mido>=1.3.3", "numpy>=1.26", "torch>=2.2", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cadence-tokenize = "cadence.dataset:main"
cadence-generate = "cadence.generate:main"
cadence-train = "cadence.train:main"
cadence-merge-shards = "cadence.merge_shards:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.pytest.ini_options]
pythonpath = ["src"]
